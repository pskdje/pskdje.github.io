<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>终端</title>
		<script src="/js/script.js"></script>
		<script>if(window.opener||window.top!==window)DEBUG[0]=false;</script>
		<link rel="stylesheet" href="https://unpkg.com/xterminal/dist/xterminal.css" />
		<script src="https://unpkg.com/xterminal/dist/xterminal.umd.js"></script>
		<style data-info="xterminal theme">
:root {
	--xt-bg: black;
	--xt-fg: #D0D0D0;
	color-scheme: dark;
}
body {
	margin: 0;
	padding: 0;
}
#main {
	height: 100cqh;
}
.terminal-error {
	color: #f85858;
}
.terminal-input-tip {
	color: #7fff00;
}
		</style>
	</head>
	<body>
		<noscript>未启用JavaScript，无法使用。</noscript>
		<div id="main">loading…</div>
		<script>// run
const term=new XTerminal({target:document.getElementById("main")});
const pushList=[];// 推送列表
var ps=`<span class="terminal-input-tip">$</span> `;
function setCompleter(f){// 设置自动补全函数
	term.setCompleter(f);
}
function write(t){// 向终端写入HTML文本
	term.write(t);
}
function writeln(t){// 向终端写入HTML文本，自动在末尾添加换行
	term.writeln(t);
}
function writeSafe(t){// 向终端写入文本
	term.writeSafe(t);
}
function writelnSafe(t){// 向终端写入文本，自动在末尾添加换行
	term.writelnSafe(t)
}
function clear(){// 清空终端
	term.clear();
	term.writeln("<i>清空终端函数已被调用</i>");
	inputPrompt();
}
function clearLast(){// 清除当前未换行的输出
	term.clearLast();
}
function focusTerm(){// 聚焦终端
	term.focus();
}
function blurTerm(){// 不聚焦终端
	term.blur();
}
function pauseTerm(){// 暂停终端用户输入
	term.pause();
}
function resumeTerm(){// 允许终端用户输入
	term.resume();
}
function inputPrompt(){// 进入输入状态
	term.write(ps);
	term.resume();
	term.focus();
}
function addHandle(f){// 添加处理函数
	if(typeof f!=="function")throw new TypeError("需要提供一个处理函数");
	pushList.push(f);
}
term.on("data",function data(input){
	term.pause();
	if(!input){
		inputPrompt();
		return;
	}else if(input==="clear"){
		term.clear();
		term.writeln("<i>已清空终端</i>");
		inputPrompt();
		return;
	}else if(input==="clearHistory"){
		term.clearHistory();
		term.writeln("历史输入已清除。");
		inputPrompt();
		return;
	}
	let isrun=false;
	try{
		for(run of pushList){
			let rrt=undefined;
			if(typeof run==="function")try{
				rrt=run(input);
			}catch(e){
				const et="命令执行时出现错误";
				console.error(et,input,e);
				term.writeln(`<span class="terminal-error">${et}</span>`);
			}
			if(typeof rrt==="symbol"){
				isrun=true;
				if(DEBUG[0])console.warn("命令返回了symbol类型将表明该命令将自行调用inputPrompt()释放终端锁定");
				return;
			}else if(typeof rrt==="number"){// 退出状态(errno)
				isrun=true;
				if(rrt===0)break;
				term.writeln(`<i>命令非零退出，状态为: ${rrt}</i>`);
				break;
			}else if(typeof rrt==="string"&&rrt){// 运行结果
				isrun=true;
				term.writeln(rrt);
				break;
			}
		}
	}catch(e){
		console.error("运行命令处理时出现错误: ",e);
		term.writeln(`<span class="terminal-error">未知故障</span>`);
	}
	if(!isrun){
		const cmd=XTerminal.escapeHTML(input.split(" ",2)[0]);
		term.writeln(`<span class="terminal-error">命令 ${cmd} 不存在</span>`);
	}
	inputPrompt();
});
term.write("Terminal open.");
(function(){// 与上游窗口交换
	let win=null;
	if(window.opener) win=window.opener;
	else if(window.parent!==window){
		win=window.parent;
		if(win instanceof HTMLIFrameElement) win=win.contentWindow;
	}
	let tc=win?.DATA_page?.terminal;
	if(typeof tc==="object"){
		term.writelnSafe(`已连接到: ${tc.originName??"[未声明]"}`);
		if(typeof tc.initialPrintStr==="string") term.writeln(tc.initialPrintStr);
	}
})();
term.write("\n");
inputPrompt();
		</script>
	</body>
</html>
